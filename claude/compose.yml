services:
  claude:
    build: .
    init: true                # reap the processes background commands leave behind
    stdin_open: true          # keep STDIN open
    tty: true                 # allocate a terminal — Claude Code is a TUI
    working_dir: /workspace
    volumes:
      - ../..:/workspace      # repo root, live-mounted (compose.yml is at docker/claude/)
      - home:/home/claude     # Claude Code + its login and history; it updates itself here

volumes:
  home:
