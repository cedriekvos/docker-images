# The site nginx serves on localhost:8000: the project's public/ directory.
# Files that exist come straight from nginx, .php files run in PHP-FPM and
# every other path goes to public/index.php, the front controller of Laravel
# and Symfony. A project with another document root changes `root`.
server {
    listen 80;
    root /workspace/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass fpm:9000;
    }
}
