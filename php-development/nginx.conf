# The site nginx serves on localhost:8000: the project's public/ directory.
# Files that exist come straight from nginx, .php files run in PHP-FPM and
# every other path goes to public/index.php, the front controller of Laravel
# and Symfony. A project with another document root changes `root`.
server {
    listen 80;
    root /workspace/public;
    index index.php index.html;

    # No upload limit of nginx's own, which would be 1 MB: upload_max_filesize
    # and post_max_size in php.ini decide.
    client_max_body_size 0;

    # PHP-FPM is looked up in Docker's DNS while nginx runs, not once at its
    # start: a rebuild replaces the fpm container, and the new one usually gets
    # another address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        set $fpm fpm:9000;   # a variable makes nginx use the resolver
        fastcgi_pass $fpm;
    }
}
