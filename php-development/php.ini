; PHP settings for this project. The php container (php, Composer, tests) and
; the fpm container (web requests) both read this file after the image's own
; php.ini, which has PHP's production defaults, so a setting here wins.
; Settings for web requests only are in php-fpm.conf.

; Code coverage comes from PCOV, which PHPUnit and Pest pick up on their own.
; It measures the first of src/, lib/ and app/ in the directory the tests run
; from; code elsewhere needs pcov.directory. compose.yml turns PCOV off for
; web requests.

; Xdebug is there for branch and path coverage, which PCOV can't measure. It
; slows PHP down and can't run alongside PCOV, so it stays off until a
; command asks for it and turns PCOV off:
; XDEBUG_MODE=coverage php -d pcov.enabled=0 vendor/bin/phpunit --path-coverage ...
xdebug.mode = off

; Other settings go below, for example:
; memory_limit = 512M
; upload_max_filesize = 50M
; post_max_size = 50M
