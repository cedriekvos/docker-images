services:
  php:
    build: .
    init: true                # reap the processes background commands leave behind
    stdin_open: true          # keep STDIN open
    tty: true                 # allocate a terminal — Claude Code is a TUI
    depends_on:
      db:
        condition: service_healthy   # start the database first, wait until it accepts connections
      nginx:
        condition: service_started   # and the web server, with PHP-FPM behind it
      mailpit:
        condition: service_started   # and the mail catcher
    volumes:
      - ../..:/workspace      # project root, live-mounted (compose.yml is at docker/shopware-development/)
      - home:/home/dev        # Claude Code + its login and history, the Composer and npm caches
      - ./php.ini:/etc/php/project.ini:ro   # PHP settings, shared with fpm

  # nginx serves the shop on localhost:8000, published on this machine only;
  # SHOPWARE_DEV_HTTP_PORT in .env next to this file picks another port. It
  # hands PHP to the fpm service; nginx.conf is the site. Like the database, it
  # keeps running after a session ends.
  nginx:
    image: nginx:1.30
    depends_on:
      fpm:
        condition: service_started
    ports:
      - "127.0.0.1:${SHOPWARE_DEV_HTTP_PORT:-8000}:80"
    volumes:
      - ../..:/workspace:ro   # the same paths as in fpm, which runs the files nginx names
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # PHP-FPM runs the shop's PHP for nginx. It is built from the same
  # Dockerfile as the php service, so it has the same PHP and extensions, and
  # it runs as dev: files the shop writes, such as var/ and public/media/,
  # belong to the host user.
  fpm:
    build: .
    # PCOV is for test runs; for web requests it only costs time.
    command: ["php-fpm", "--fpm-config", "/etc/php-fpm.conf", "-d", "pcov.enabled=0"]
    volumes:
      - ../..:/workspace
      - ./php-fpm.conf:/etc/php-fpm.conf:ro
      - ./php.ini:/etc/php/project.ini:ro   # PHP settings, shared with php

  # MySQL for the shop: host `db` from the php and fpm containers,
  # localhost:3306 from this machine, for a database GUI; SHOPWARE_DEV_DB_PORT
  # in .env picks another port on this machine. It is published on this
  # machine only, hence the throwaway root password. It keeps running after a
  # session ends; the next start reuses it.
  db:
    image: mysql:8.4
    # Shopware's collation as the default for new databases and tables. No
    # binary log: it is for replication, and every indexing run would make it
    # grow.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--disable-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopware
    ports:
      - "127.0.0.1:${SHOPWARE_DEV_DB_PORT:-3306}:3306"
    healthcheck:              # over TCP, so it only passes once start-up has finished
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=root", "--password=root", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 60s       # the first start sets up the data directory, which takes a while
    volumes:
      - db:/var/lib/mysql     # the data; survives sessions and rebuilds

  # Mailpit catches every mail the shop sends, on mailpit:1025, and shows them
  # at localhost:8025; SHOPWARE_DEV_MAIL_PORT in .env picks another port. It
  # keeps the mails in memory, so they are gone when it restarts.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:${SHOPWARE_DEV_MAIL_PORT:-8025}:8025"

volumes:
  home:
  db:
