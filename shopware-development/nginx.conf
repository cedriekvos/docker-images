# The shop nginx serves on localhost:8000: the project's public/ directory.
# Files that exist come straight from nginx, .php files run in PHP-FPM and
# every other path goes to public/index.php, Shopware's front controller,
# which also makes the thumbnails that don't exist yet. The rules follow
# Shopware's own nginx configuration, without its long caching headers, which
# during development would keep a rebuilt file from showing.
server {
    listen 80;
    root /workspace/public;
    index index.php;

    # No upload limit of nginx's own, which would be 1 MB: upload_max_filesize
    # and post_max_size in php.ini decide.
    client_max_body_size 0;

    # PHP-FPM is looked up in Docker's DNS while nginx runs, not once at its
    # start: a rebuild replaces the fpm container, and the new one usually gets
    # another address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Uploaded and generated files are never run as PHP.
    location ~ ^/(media|thumbnail|theme|bundles|sitemap).*\.php$ {
        deny all;
    }

    # An SVG can carry scripts; this keeps an uploaded one from running them.
    location ~* \.svg$ {
        add_header Content-Security-Policy "script-src 'none'";
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";   # no proxy from a request header (httpoxy)

        # In dev mode, Symfony's profiler sends long headers. With nginx's
        # default buffers they end in "502 Bad Gateway" and "upstream sent too
        # big header" in the log.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;

        # Indexing, installing an extension or compiling a theme from the
        # Administration can take longer than nginx's default of a minute.
        # max_execution_time in php-fpm.conf is the same five minutes.
        fastcgi_read_timeout 300s;

        set $fpm fpm:9000;   # a variable makes nginx use the resolver
        fastcgi_pass $fpm;
    }
}
