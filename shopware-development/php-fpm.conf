; PHP-FPM for the fpm service. It runs as the image's dev user, so there is no
; user or group setting and no PID file, and it logs to the container's output.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; nginx connects to fpm:9000 over the compose network; it isn't published.
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; What the shop writes to stdout or stderr ends up in the log too.
catch_workers_output = yes
decorate_workers_output = no

; Development settings for web requests only; php.ini has the ones the
; command line shares. Errors show in the page, and a change to the code
; shows on the next request instead of up to two seconds later.
php_flag[display_errors] = on
php_value[opcache.revalidate_freq] = 0

; Shopware asks for at least 512 MB; PHP's default is 128 MB. The command line
; keeps its own default, no limit, for bin/console.
php_value[memory_limit] = 512M

; Five minutes instead of 30 seconds, for the long requests of the
; Administration, such as indexing or compiling a theme. nginx.conf waits as
; long.
php_value[max_execution_time] = 300
