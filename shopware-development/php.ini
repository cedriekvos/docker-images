; PHP settings for this project. The php container (php, Composer, bin/console,
; tests) and the fpm container (web requests) both read this file after the
; image's own php.ini, which has PHP's production defaults, so a setting here
; wins. Settings for web requests only are in php-fpm.conf.

; Development values instead of the production ones: every error, warning and
; deprecation is reported, and assert() runs. The production value -1 leaves
; assert() out when the code is compiled, which a script can't undo.
error_reporting = E_ALL
zend.assertions = 1

; OPcache keeps compiled PHP in memory. Shopware and its packages have more
; PHP files than OPcache's defaults hold, which makes every request slower.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 20
opcache.max_accelerated_files = 20000

; Uploads in the Administration, such as product images and imports. PHP's
; defaults are 2 MB per file and 8 MB per request.
upload_max_filesize = 32M
post_max_size = 32M

; Code coverage comes from PCOV, which PHPUnit picks up on its own. It
; measures the first of src/, lib/ and app/ in the directory the tests run
; from, such as an extension's directory in custom/plugins/. For tests run
; from somewhere else, set pcov.directory, for example:
; pcov.directory = /workspace/custom/plugins
; compose.yml turns PCOV off for web requests.

; Xdebug is there for branch and path coverage, which PCOV can't measure. It
; slows PHP down and can't run alongside PCOV, so it stays off until a
; command asks for it and turns PCOV off:
; XDEBUG_MODE=coverage php -d pcov.enabled=0 vendor/bin/phpunit --path-coverage ...
xdebug.mode = off
